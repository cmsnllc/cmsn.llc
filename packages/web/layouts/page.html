<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Coming Soon LLC</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+1+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="bg-bg font-body text-body text-phosphor selection:bg-phosphor selection:text-on-phosphor">
  <header class="mx-auto max-w-content px-4 py-8">
    <a class="font-display text-2xl no-underline" href="/">CMSN</a>
  </header>
  <main class="mx-auto max-w-content px-4">
    <article class="border-2 border-phosphor bg-paper text-ink">
      <div class="flex justify-between gap-4 bg-phosphor px-4 py-2 font-display text-label text-on-phosphor">
        <span>P/{{ id }}</span>
        <time datetime="{{ date }}">{{ date }}</time>
      </div>
      <div class="px-5 pt-8 pb-10 sm:px-10 sm:pt-12 sm:pb-14">
        <h1 class="mb-8 text-[clamp(1.5rem,5vw,2rem)] leading-snug font-bold wrap-anywhere">{{ title }}</h1>
        <div class="prose-cm">
{{{ content }}}
        </div>
      </div>
    </article>
  </main>
  <footer class="mx-auto mt-20 max-w-content px-4 py-8 text-small text-phosphor-muted">
    <div class="border-t-2 border-line-faint pt-8">
      <a class="underline" href="/">カミング・スーン合同会社 / Coming Soon LLC</a>
    </div>
  </footer>
</body>
</html>
